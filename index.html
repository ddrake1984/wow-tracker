<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoW Forever Character Tracker</title>
  <meta name="description" content="Level, gear, talents and professions for my WoW Forever characters, pulled live from the Blizzard API.">
  <!-- Link previews (Discord, etc.) -->
  <meta property="og:title" content="WoW Forever Character Tracker">
  <meta property="og:description" content="Level, gear, talents and professions for my WoW Forever characters, pulled live from the Blizzard API.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ddrake1984.github.io/wow-tracker/">
  <meta name="theme-color" content="#e8c26a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Wowhead item tooltips on hover -->
  <script>const whTooltips = { colorLinks: false, iconizeLinks: true, renameLinks: false, iconSize: 'small' };</script>
  <script src="https://wow.zamimg.com/js/tooltips.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>The Pot Family</h1>
      <p class="sub">WoW Forever progression tracker</p>
      <p class="status" id="status"></p>
    </div>
  </header>

  <main class="wrap">
    <nav class="roster" id="roster" aria-label="Characters"></nav>
    <section id="detail" class="detail" aria-live="polite"></section>
  </main>

  <footer class="wrap site-footer">
    Data from the Blizzard Battle.net API, refreshed automatically by GitHub Actions.
    Edit <code>characters.config.json</code> to change the roster or the manual fallbacks.
  </footer>

  <!-- Generated by scripts/fetch-characters.mjs; loaded as a script so the page also works from file:// -->
  <script src="data/characters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
